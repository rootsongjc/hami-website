<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" aria-labelledby="title description" role="img" viewBox="0 0 1200 940"><title id="title">GPU fragmentation before and after running HAMi GPU Descheduler</title><desc id="description">Before: eight pods are scattered as single shards across two 4-GPU nodes, and a new Pod requesting one whole GPU stays pending although 67 percent of cluster GPU memory is free. After: the descheduler evicts and re-pins pods onto three GPUs of node A, the new Pod lands on the fourth GPU, and node B is fully drained.</desc><defs><marker id="bigArrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#10d05d" d="M 0 0 L 10 5 L 0 10 Z"/></marker><style>text{fill:#d8eefb;font-family:&quot;Source Sans 3&quot;,&quot;Noto Sans&quot;,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;font-size:18px}.chip text{font-weight:600;fill:#fff;font-size:14px;text-anchor:middle}.heading,.label{fill:#f0f6fd;font-weight:600}.heading{font-family:&quot;Space Grotesk&quot;,&quot;Avenir Next&quot;,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;font-size:24px}.label{font-size:20px}.muted,.tiny{fill:#9eb6ce;font-size:16px}.tiny{font-size:13px}.gpu{fill:#171e27}.nodebox,.panel{fill:#171e27;stroke-width:1.5}.panel{stroke:#2a3442}.nodebox{stroke:#9eb6ce}.gpu{stroke:#2a3442;stroke-width:1.2}.bar-free{fill:#2a3442}.chip rect{stroke:rgba(255,255,255,.55);stroke-width:1}.pending{fill:none;stroke:#e5484d;stroke-width:2;stroke-dasharray:8 6}.badge-red{fill:#e5484d}.badge-red-t{fill:#fff;font-size:15px;font-weight:600;text-anchor:middle}.badge-green{fill:#10d05d}.badge-green-t{fill:#fff;font-size:15px;font-weight:600;text-anchor:middle}.green,.red{fill:#35e37b;font-size:17px;font-weight:600}.red{fill:#e5484d}.arrow-green{fill:none;stroke:#10d05d;stroke-width:5;marker-end:url(#bigArrow)}.pa{fill:#39c6f4}.pb{fill:#10d05d}.pc{fill:#f5a623}.pd{fill:#9b7bef}.pe{fill:#2dd4bf}.pf{fill:#f472b6}.pg{fill:#7ca8ff}.ph{fill:#a3e635}.pn{fill:#6366f1}</style></defs><rect width="1200" height="940" fill="#0b0f14" rx="16"/><rect width="1152" height="360" x="24" y="24" class="panel" rx="14"/><text x="48" y="64" class="heading">Before: GPU fragmentation</text><text x="48" y="92" class="muted">Pods come and go; every GPU is left holding a shard</text><rect width="856" height="130" x="48" y="106" class="nodebox" rx="10"/><text x="64" y="130" class="label">Node A</text><text x="140" y="130" class="tiny">4 GPUs</text><rect width="198" height="84" x="64" y="140" class="gpu" rx="8"/><text x="76" y="162" class="tiny">GPU 0</text><g class="chip"><rect width="92" height="26" x="74" y="168" class="pa" rx="6"/><text x="120" y="186">a · 30%</text></g><rect width="178" height="10" x="74" y="202" class="bar-free" rx="3"/><rect width="53" height="10" x="74" y="202" class="pa" rx="3"/><rect width="198" height="84" x="272" y="140" class="gpu" rx="8"/><text x="284" y="162" class="tiny">GPU 1</text><g class="chip"><rect width="92" height="26" x="282" y="168" class="pb" rx="6"/><text x="328" y="186">b · 40%</text></g><rect width="178" height="10" x="282" y="202" class="bar-free" rx="3"/><rect width="71" height="10" x="282" y="202" class="pb" rx="3"/><rect width="198" height="84" x="480" y="140" class="gpu" rx="8"/><text x="492" y="162" class="tiny">GPU 2</text><g class="chip"><rect width="92" height="26" x="490" y="168" class="pc" rx="6"/><text x="536" y="186">c · 25%</text></g><rect width="178" height="10" x="490" y="202" class="bar-free" rx="3"/><rect width="45" height="10" x="490" y="202" class="pc" rx="3"/><rect width="198" height="84" x="688" y="140" class="gpu" rx="8"/><text x="700" y="162" class="tiny">GPU 3</text><g class="chip"><rect width="92" height="26" x="698" y="168" class="pd" rx="6"/><text x="744" y="186">d · 45%</text></g><rect width="178" height="10" x="698" y="202" class="bar-free" rx="3"/><rect width="80" height="10" x="698" y="202" class="pd" rx="3"/><rect width="856" height="130" x="48" y="248" class="nodebox" rx="10"/><text x="64" y="272" class="label">Node B</text><text x="140" y="272" class="tiny">4 GPUs</text><rect width="198" height="84" x="64" y="282" class="gpu" rx="8"/><text x="76" y="304" class="tiny">GPU 0</text><g class="chip"><rect width="92" height="26" x="74" y="310" stroke-dasharray="5 3" class="pe" rx="6"/><text x="120" y="328">e · 35%</text></g><rect width="178" height="10" x="74" y="344" class="bar-free" rx="3"/><rect width="62" height="10" x="74" y="344" class="pe" rx="3"/><rect width="198" height="84" x="272" y="282" class="gpu" rx="8"/><text x="284" y="304" class="tiny">GPU 1</text><g class="chip"><rect width="92" height="26" x="282" y="310" stroke-dasharray="5 3" class="pf" rx="6"/><text x="328" y="328">f · 20%</text></g><rect width="178" height="10" x="282" y="344" class="bar-free" rx="3"/><rect width="36" height="10" x="282" y="344" class="pf" rx="3"/><rect width="198" height="84" x="480" y="282" class="gpu" rx="8"/><text x="492" y="304" class="tiny">GPU 2</text><g class="chip"><rect width="92" height="26" x="490" y="310" stroke-dasharray="5 3" class="pg" rx="6"/><text x="536" y="328">g · 40%</text></g><rect width="178" height="10" x="490" y="344" class="bar-free" rx="3"/><rect width="71" height="10" x="490" y="344" class="pg" rx="3"/><rect width="198" height="84" x="688" y="282" class="gpu" rx="8"/><text x="700" y="304" class="tiny">GPU 3</text><g class="chip"><rect width="92" height="26" x="698" y="310" stroke-dasharray="5 3" class="ph" rx="6"/><text x="744" y="328">h · 30%</text></g><rect width="178" height="10" x="698" y="344" class="bar-free" rx="3"/><rect width="53" height="10" x="698" y="344" class="ph" rx="3"/><rect width="252" height="272" x="924" y="106" class="pending" rx="14"/><text x="1050" y="140" class="label" text-anchor="middle">New Pod</text><rect width="80" height="44" x="1010" y="156" fill="none" stroke="#6366f1" stroke-width="2" rx="8"/><text x="1050" y="184" fill="#6366f1" font-size="15" font-weight="600" text-anchor="middle">1 GPU</text><text x="1050" y="228" class="muted" text-anchor="middle">requests one whole GPU</text><text x="1050" y="250" class="muted" text-anchor="middle">(100% of a device)</text><rect width="204" height="30" x="948" y="268" class="badge-red" rx="15"/><text x="1050" y="288" class="badge-red-t" text-anchor="middle">Pending · unschedulable</text><text x="1050" y="330" class="red" text-anchor="middle">67% of GPU memory is free,</text><text x="1050" y="352" class="red" text-anchor="middle">yet no single GPU fits</text><path d="M 500 398 L 500 446" class="arrow-green"/><text x="528" y="418" class="label">HAMi GPU Descheduler</text><text x="528" y="442" class="muted">evict e·f·g·h → controller recreates → HamiPodPlacement pins each Pod to Node A</text><rect width="1152" height="446" x="24" y="470" class="panel" rx="14"/><text x="48" y="510" class="heading">After: consolidated</text><text x="48" y="538" class="muted">The same eight Pods share three GPUs; the new Pod starts, and Node B is drained</text><rect width="856" height="214" x="48" y="552" class="nodebox" rx="10"/><text x="64" y="576" class="label">Node A</text><text x="140" y="576" class="tiny">4 GPUs</text><rect width="198" height="112" x="64" y="590" class="gpu" rx="8"/><text x="76" y="610" class="tiny">GPU 0</text><g class="chip"><rect width="88" height="24" x="74" y="618" class="pd" rx="6"/><text x="118" y="635">d · 45%</text></g><g class="chip"><rect width="88" height="24" x="168" y="618" class="pa" rx="6"/><text x="212" y="635">a · 30%</text></g><g class="chip"><rect width="88" height="24" x="74" y="646" stroke-dasharray="5 3" class="pf" rx="6"/><text x="118" y="663">f · 20%</text></g><rect width="178" height="10" x="74" y="680" class="bar-free" rx="3"/><rect width="80" height="10" x="74" y="680" class="pd"/><rect width="53" height="10" x="154" y="680" class="pa"/><rect width="36" height="10" x="207" y="680" class="pf"/><rect width="198" height="112" x="272" y="590" class="gpu" rx="8"/><text x="284" y="610" class="tiny">GPU 1</text><g class="chip"><rect width="88" height="24" x="282" y="618" class="pb" rx="6"/><text x="326" y="635">b · 40%</text></g><g class="chip"><rect width="88" height="24" x="376" y="618" class="pc" rx="6"/><text x="420" y="635">c · 25%</text></g><g class="chip"><rect width="88" height="24" x="282" y="646" stroke-dasharray="5 3" class="pe" rx="6"/><text x="326" y="663">e · 35%</text></g><rect width="178" height="10" x="282" y="680" class="pb" rx="3"/><rect width="45" height="10" x="353" y="680" class="pc"/><rect width="62" height="10" x="398" y="680" class="pe"/><rect width="198" height="112" x="480" y="590" class="gpu" rx="8"/><text x="492" y="610" class="tiny">GPU 2</text><g class="chip"><rect width="88" height="24" x="490" y="618" stroke-dasharray="5 3" class="pg" rx="6"/><text x="534" y="635">g · 40%</text></g><g class="chip"><rect width="88" height="24" x="584" y="618" stroke-dasharray="5 3" class="ph" rx="6"/><text x="628" y="635">h · 30%</text></g><rect width="178" height="10" x="490" y="680" class="bar-free" rx="3"/><rect width="71" height="10" x="490" y="680" class="pg"/><rect width="53" height="10" x="561" y="680" class="ph"/><rect width="198" height="112" x="688" y="590" class="gpu" rx="8"/><text x="700" y="610" class="tiny">GPU 3</text><g class="chip"><rect width="178" height="24" x="698" y="618" class="pn" rx="6"/><text x="787" y="635">new Pod · 100%</text></g><text x="787" y="663" class="green" text-anchor="middle">✓ scheduled</text><rect width="178" height="10" x="698" y="680" class="pn" rx="3"/><rect width="856" height="122" x="48" y="778" class="nodebox" rx="10"/><text x="64" y="802" class="label">Node B</text><rect width="88" height="24" x="148" y="786" class="badge-green" rx="12"/><text x="192" y="803" class="badge-green-t" text-anchor="middle">drained</text><rect width="198" height="76" x="64" y="814" class="gpu" rx="8"/><text x="76" y="836" class="tiny">GPU 0</text><rect width="178" height="10" x="74" y="846" class="bar-free" rx="3"/><text x="76" y="876" class="tiny">free 100%</text><rect width="198" height="76" x="272" y="814" class="gpu" rx="8"/><text x="284" y="836" class="tiny">GPU 1</text><rect width="178" height="10" x="282" y="846" class="bar-free" rx="3"/><text x="284" y="876" class="tiny">free 100%</text><rect width="198" height="76" x="480" y="814" class="gpu" rx="8"/><text x="492" y="836" class="tiny">GPU 2</text><rect width="178" height="10" x="490" y="846" class="bar-free" rx="3"/><text x="492" y="876" class="tiny">free 100%</text><rect width="198" height="76" x="688" y="814" class="gpu" rx="8"/><text x="700" y="836" class="tiny">GPU 3</text><rect width="178" height="10" x="698" y="846" class="bar-free" rx="3"/><text x="700" y="876" class="tiny">free 100%</text><rect width="252" height="348" x="924" y="552" fill="#171e27" stroke="#10d05d" stroke-width="1.5" rx="14"/><text x="1050" y="584" class="label" text-anchor="middle">Result</text><rect width="204" height="30" x="948" y="600" class="badge-green" rx="15"/><text x="1050" y="620" class="badge-green-t" text-anchor="middle">New Pod: Running</text><text x="948" y="656" class="muted">on Node A / GPU 3</text><text x="948" y="700" class="green">✓ 4 whole GPUs freed (Node B)</text><text x="948" y="722" class="muted">ready for scale-down or</text><text x="948" y="744" class="muted">a large training job</text><text x="948" y="786" class="green">✓ GPU memory in use:</text><text x="948" y="808" class="muted">33% → 43% with the new Pod</text><text x="948" y="830" class="muted">admitted on the same cluster</text><text x="948" y="866" class="tiny">dashed chips = Pods evicted and</text><text x="948" y="884" class="tiny">re-pinned by gpu-descheduler</text></svg>